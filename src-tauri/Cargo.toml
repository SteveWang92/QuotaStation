[package]
name = "quotastation"
version = "0.2.0"
description = "Local-first AI quota and usage monitoring for Windows"
authors = ["Steve Wang <contact@stevewang.me>"]
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "quotastation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
ccusage-adapter-claude = { path = "../vendor/ccusage/rust/adapters/claude" }
ccusage-adapter-codex = { path = "../vendor/ccusage/rust/adapters/codex" }
# The pricing catalog comes from the vendored snapshot named in .cargo/config.toml, so the
# build does not need ccusage's downloader or the TLS stack behind it.
ccusage-core = { path = "../vendor/ccusage/rust/crates/ccusage-core" }
jiff = "0.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
which = "8"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
