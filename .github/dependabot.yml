version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 2
    cooldown:
      default-days: 21
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 3
    cooldown:
      default-days: 21
      semver-major-days: 30
    # Tracks the Node line pinned in .nvmrc, so a major moves only with Node itself.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-production:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 2
    # Declared only by the vendored ccusage workspace, which no crate built here uses; the
    # vendored tree changes with the audited upstream revision, not by version bumps.
    ignore:
      - dependency-name: schemars
    cooldown:
      default-days: 21
      semver-major-days: 30
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
