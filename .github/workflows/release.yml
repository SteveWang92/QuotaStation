name: Release installer

# The installer is built from the published tag rather than from a branch, so what people
# download is the tree the release notes describe. Publishing the release is still a manual
# step; this workflow only attaches the artifact to it afterwards. The dispatch form exists
# for a release whose build failed or was published before this workflow existed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach an installer to
        required: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds the renderer through the configured beforeBuildCommand, then the optimized
      # core, then the per-user NSIS installer.
      - name: Build the installer
        run: npm run build:installer

      - name: Store the installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1

  attach:
    name: Attach the installer to the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer

      # The installer is unsigned; QuotaStation buys no code-signing certificate. See
      # docs/development.md for what that means for the people who download it.
      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" installer/*-setup.exe --clobber
