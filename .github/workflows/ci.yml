name: CI

# Base-branch filter, not a typo: pull_request fires on the PR's target branch, so this runs
# on every pull request proposing work into dev, on the dev->main release PR, and again on
# the merge commit that lands on main. A Windows runner bills at twice the wall clock and a
# cold Rust build dominates it, so a push to dev is deliberately not covered: work committed
# straight to dev is gated by the local run CLAUDE.md requires, while a pull request is the
# one path whose author may not have run it.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

# One run per commit: a newer push to a branch cancels its in-flight run. main is exempt so
# a release commit's check always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# A runner is a clean machine every time, so incremental artifacts are only dead weight in
# the cache, and nothing here reads a debugger or a backtrace line number.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  # QuotaStation is a Windows desktop application: the core compiles Win32 window
  # management, and the Tauri build script needs the built renderer in dist/, so both
  # halves are verified together on a Windows runner.
  verify:
    name: Lint, test and build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint renderer
        id: lint_renderer
        run: npm run lint

      - name: Test renderer
        id: test_renderer
        run: npm test

      - name: Build renderer
        id: build_renderer
        run: npm run build

      # Tauri and the vendored ccusage crates dominate a cold build, so the downloaded
      # crates and the compiled dependencies are restored between runs. Extracted crate
      # sources (registry/src) are left out: unpacking them again is cheaper than moving
      # them through the cache. A run that matches the key restores without re-uploading,
      # so only a Cargo.lock change pays the save cost.
      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check core formatting
        id: fmt_core
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Clippy shares the target directory with the test step below, so the crate is
      # compiled once for both.
      - name: Lint core
        id: lint_core
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test core
        id: test_core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Write job summary
        if: always()
        shell: bash
        env:
          LINT_RENDERER_OUTCOME: ${{ steps.lint_renderer.outcome }}
          TEST_RENDERER_OUTCOME: ${{ steps.test_renderer.outcome }}
          BUILD_RENDERER_OUTCOME: ${{ steps.build_renderer.outcome }}
          FMT_CORE_OUTCOME: ${{ steps.fmt_core.outcome }}
          LINT_CORE_OUTCOME: ${{ steps.lint_core.outcome }}
          TEST_CORE_OUTCOME: ${{ steps.test_core.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; *) echo "❓";; esac; }
          {
            echo "## CI: lint, test and build"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Lint renderer | $(icon "$LINT_RENDERER_OUTCOME") $LINT_RENDERER_OUTCOME |"
            echo "| Test renderer | $(icon "$TEST_RENDERER_OUTCOME") $TEST_RENDERER_OUTCOME |"
            echo "| Build renderer | $(icon "$BUILD_RENDERER_OUTCOME") $BUILD_RENDERER_OUTCOME |"
            echo "| Check core formatting | $(icon "$FMT_CORE_OUTCOME") $FMT_CORE_OUTCOME |"
            echo "| Lint core | $(icon "$LINT_CORE_OUTCOME") $LINT_CORE_OUTCOME |"
            echo "| Test core | $(icon "$TEST_CORE_OUTCOME") $TEST_CORE_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"
